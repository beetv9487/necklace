<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>💫 給你的驚喜</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  width:100%;height:100%;
  background:#04030a;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  overflow:hidden;user-select:none;
  -webkit-user-select:none;
  touch-action:none;
  font-family:serif;color:#e8d5a3;
}
.scene{perspective:600px;perspective-origin:50% 50%;}
.card{
  position:relative;
  width:min(300px,82vw);
  aspect-ratio:3/4;
  border-radius:8px;
  touch-action:none;cursor:grab;
  box-shadow:0 30px 70px rgba(0,0,0,.92);
  overflow:hidden;
  transition:transform .05s linear;
}
.card:active{cursor:grabbing;}

video{
  width:100%;height:100%;
  object-fit:cover;
  display:block;
  pointer-events:none;
}

.vignette{
  position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 70% 72% at 50% 50%,transparent 20%,rgba(2,1,10,.82) 100%);
}
.gloss{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;transition:background .05s;}
.frame{
  position:absolute;inset:0;pointer-events:none;
  box-shadow:inset 0 0 0 2px rgba(201,169,110,.5),inset 0 0 0 7px rgba(0,0,0,.15);
}
.frame::after{
  content:"✦  給你的  ✦";
  position:absolute;top:10px;left:50%;transform:translateX(-50%);
  font-size:.55rem;color:rgba(201,169,110,.65);letter-spacing:.15em;white-space:nowrap;font-style:italic;
}
.corners{position:absolute;inset:0;pointer-events:none;}
.c{position:absolute;width:15px;height:15px;border-color:#c9a96e;border-style:solid;opacity:.8;}
.tl{top:4px;left:4px;border-width:2px 0 0 2px;}.tr{top:4px;right:4px;border-width:2px 2px 0 0;}
.bl{bottom:4px;left:4px;border-width:0 0 2px 2px;}.br{bottom:4px;right:4px;border-width:0 2px 2px 0;}

.hint{
  position:absolute;bottom:12px;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,.6);color:rgba(255,255,255,.8);
  font-size:.62rem;letter-spacing:.1em;padding:.28rem .85rem;
  border-radius:20px;white-space:nowrap;pointer-events:none;
  transition:opacity .6s;
}

.shadow-el{
  width:min(280px,75vw);height:18px;
  background:radial-gradient(ellipse,rgba(0,0,20,.9) 0%,transparent 70%);
  margin-top:3px;filter:blur(6px);transition:transform .05s;
}
.caption{
  font-style:italic;font-size:1rem;text-align:center;
  margin-top:.9rem;letter-spacing:.05em;line-height:1.6;
}
.hint-txt{
  font-size:.6rem;letter-spacing:.15em;color:rgba(201,169,110,.38);
  margin-top:.4rem;text-align:center;transition:opacity .5s;
}
</style>
</head>
<body>
<div class="scene">
  <div class="card" id="card">
    <video id="vid" preload="auto" muted playsinline webkit-playsinline>
      <source src="video.mp4" type="video/mp4">
    </video>
    <div class="vignette"></div>
    <div class="gloss" id="gloss"></div>
    <div class="frame"></div>
    <div class="corners">
      <div class="c tl"></div><div class="c tr"></div>
      <div class="c bl"></div><div class="c br"></div>
    </div>
    <div class="hint" id="hint">拖動畫面控制視角</div>
  </div>
</div>
<div class="shadow-el" id="shadowEl"></div>
<p class="caption">每次看見這條項鍊<br>就想起你</p>
<div class="hint-txt" id="hintTxt">左右上下拖動 · 感受不同視角</div>

<script>
var vid=document.getElementById('vid');
var card=document.getElementById('card');
var gloss=document.getElementById('gloss');
var shadowEl=document.getElementById('shadowEl');
var hint=document.getElementById('hint');

var DURATION=10.0;
var px=0.5,py=0.5;
var isDragging=false;
var startX=0,startY=0,startPx=0.5,startPy=0.5;
var lastSeek=0;

// 影片就緒後暫停在中間
vid.addEventListener('loadedmetadata',function(){
  vid.pause();
  vid.currentTime=DURATION*0.5;
});
vid.addEventListener('play',function(){vid.pause();});

function seekTo(nx,ny){
  px=Math.max(0,Math.min(1,nx));
  py=Math.max(0,Math.min(1,ny));

  // X 軸控制影片進度（視角左右）
  var now=Date.now();
  if(now-lastSeek>16){
    vid.currentTime=px*DURATION;
    lastSeek=now;
  }

  // 卡片傾斜
  var ry=(px-0.5)*2*28;
  var rx=(py-0.5)*2*-18;
  card.style.transform='perspective(600px) rotateY('+ry+'deg) rotateX('+rx+'deg)';

  // 光澤
  var gx=20+(1-px)*60, gy=20+(1-py)*60;
  gloss.style.background='radial-gradient(ellipse 70% 70% at '+gx+'% '+gy+'%, rgba(255,255,255,.12) 0%, transparent 55%)';

  // 陰影
  shadowEl.style.transform='skewX('+((px-0.5)*16)+'deg) scaleX('+(1-Math.abs(px-0.5)*.5)+')';
}

function onStart(ex,ey){
  isDragging=true;
  startX=ex;startY=ey;
  startPx=px;startPy=py;
  hint.style.opacity='0';
}
function onMove(ex,ey){
  if(!isDragging)return;
  seekTo(startPx+(ex-startX)/180, startPy+(ey-startY)/180);
}
function onEnd(){isDragging=false;}

card.addEventListener('mousedown',function(e){onStart(e.clientX,e.clientY);e.preventDefault();});
document.addEventListener('mousemove',function(e){onMove(e.clientX,e.clientY);});
document.addEventListener('mouseup',onEnd);

card.addEventListener('touchstart',function(e){
  e.preventDefault();
  onStart(e.changedTouches[0].clientX,e.changedTouches[0].clientY);
},{passive:false});
document.addEventListener('touchmove',function(e){
  e.preventDefault();
  if(!isDragging)return;
  onMove(e.changedTouches[0].clientX,e.changedTouches[0].clientY);
},{passive:false});
document.addEventListener('touchend',onEnd,{passive:false});
document.addEventListener('touchcancel',onEnd,{passive:false});

setTimeout(function(){
  document.getElementById('hint').style.opacity='0';
  document.getElementById('hintTxt').style.opacity='0';
},5000);
</script>
</body>
</html>
