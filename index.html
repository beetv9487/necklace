<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>💫 給你的驚喜</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  width:100%;height:100%;
  background:#04030a;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  overflow:hidden;user-select:none;
  -webkit-user-select:none;
  touch-action:none;
  font-family:serif;color:#e8d5a3;
}
.scene{perspective:600px;perspective-origin:50% 50%;}
.card{
  position:relative;
  width:min(300px,82vw);
  aspect-ratio:3/4;
  border-radius:8px;
  touch-action:none;cursor:grab;
  box-shadow:0 30px 70px rgba(0,0,0,.92);
  overflow:hidden;
  transition:transform .06s linear;
}
.card:active{cursor:grabbing;}

/* BG: blurred photo, fixed */
.l-bg{
  position:absolute;inset:0;z-index:1;
}
.l-bg img{
  width:100%;height:100%;
  object-fit:cover;display:block;
}

/* Person: from GitHub, moves opposite = pops forward */
.l-person{
  position:absolute;
  inset:-15%;width:130%;height:130%;
  z-index:2;
  will-change:transform;
  animation:breathe 4s ease-in-out infinite;
}
@keyframes breathe{
  0%,100%{transform:translate(-11.5%,-11.5%) scale(1);}
  50%{transform:translate(-11.5%,-13%) scale(1.01);}
}
.l-person img{
  width:100%;height:100%;
  object-fit:contain;object-position:center center;
  display:block;
  filter:
    drop-shadow(-6px 0 16px rgba(0,0,0,.7))
    drop-shadow(6px 0 16px rgba(0,0,0,.7))
    drop-shadow(0 20px 32px rgba(0,0,0,.85));
}

.vignette{
  position:absolute;inset:0;z-index:3;pointer-events:none;
  background:radial-gradient(ellipse 70% 72% at 50% 50%,transparent 20%,rgba(2,1,10,.82) 100%);
}
.gloss{position:absolute;inset:0;z-index:4;pointer-events:none;mix-blend-mode:screen;transition:background .06s;}
.frame{
  position:absolute;inset:0;z-index:5;pointer-events:none;
  box-shadow:inset 0 0 0 2px rgba(201,169,110,.5),inset 0 0 0 7px rgba(0,0,0,.15);
}
.frame::after{
  content:"✦  給你的  ✦";
  position:absolute;top:10px;left:50%;transform:translateX(-50%);
  font-size:.55rem;color:rgba(201,169,110,.65);letter-spacing:.15em;white-space:nowrap;font-style:italic;
}
.corners{position:absolute;inset:0;z-index:6;pointer-events:none;}
.c{position:absolute;width:15px;height:15px;border-color:#c9a96e;border-style:solid;opacity:.8;}
.tl{top:4px;left:4px;border-width:2px 0 0 2px;}.tr{top:4px;right:4px;border-width:2px 2px 0 0;}
.bl{bottom:4px;left:4px;border-width:0 0 2px 2px;}.br{bottom:4px;right:4px;border-width:0 2px 2px 0;}

.shadow-el{
  width:min(280px,75vw);height:18px;
  background:radial-gradient(ellipse,rgba(0,0,20,.9) 0%,transparent 70%);
  margin-top:3px;filter:blur(6px);transition:transform .06s;
}
.caption{font-style:italic;font-size:1rem;text-align:center;margin-top:.9rem;letter-spacing:.05em;line-height:1.6;}
.hint-txt{font-size:.6rem;letter-spacing:.15em;color:rgba(201,169,110,.38);margin-top:.4rem;text-align:center;transition:opacity .5s;}
</style>
</head>

    <!-- 人物：去背 PNG，傾斜時往反方向移動（凸出） -->
    <div class="l-person" id="lPerson">
      <img src="person.png" alt="">
    </div>

    <div class="vignette"></div>
    <div class="gloss" id="gloss"></div>
    <div class="frame"></div>
    <div class="corners">
      <div class="c tl"></div><div class="c tr"></div>
      <div class="c bl"></div><div class="c br"></div>
    </div>
  </div>
</div>
<div class="shadow-el" id="shadowEl"></div>
<p class="caption">每次看見這條項鍊<br>就想起你</p>
<div class="hint-txt" id="hintTxt">移動或傾斜手機 · 人物凸出</div>

<script>
var card=document.getElementById('card');
var lPerson=document.getElementById('lPerson');
var gloss=document.getElementById('gloss');
var shadowEl=document.getElementById('shadowEl');
var px=0,py=0,isDragging=false,startX=0,startY=0,startPx=0,startPy=0;

function applyTilt(nx,ny){
  // 卡片傾斜
  card.style.transform='perspective(600px) rotateY('+(nx*28)+'deg) rotateX('+(-ny*20)+'deg)';
  // 人物往反方向移動（凸出），base offset -11.5% 是因為 inset:-15%
  var ox=-11.5+(-nx*11);
  var oy=-11.5+(-ny*8);
  lPerson.style.transform='translate('+ox+'%,'+oy+'%)';
  // 光澤
  var gx=20+(1-(nx+1)/2)*60,gy=20+(1-(ny+1)/2)*60;
  gloss.style.background='radial-gradient(ellipse 70% 70% at '+gx+'% '+gy+'%, rgba(255,255,255,.13) 0%, transparent 55%)';
  // 陰影
  shadowEl.style.transform='skewX('+(nx*10)+'deg) scaleX('+(1-Math.abs(nx)*.3)+')';
}

function onStart(ex,ey){isDragging=true;startX=ex;startY=ey;startPx=px;startPy=py;}
function onMove(ex,ey){
  if(!isDragging)return;
  px=Math.max(-1,Math.min(1,startPx+(ex-startX)/110));
  py=Math.max(-1,Math.min(1,startPy+(ey-startY)/110));
  applyTilt(px,py);
}
function onEnd(){isDragging=false;}

card.addEventListener('mousedown',function(e){onStart(e.clientX,e.clientY);e.preventDefault();});
document.addEventListener('mousemove',function(e){onMove(e.clientX,e.clientY);});
document.addEventListener('mouseup',onEnd);
card.addEventListener('touchstart',function(e){e.preventDefault();onStart(e.changedTouches[0].clientX,e.changedTouches[0].clientY);},{passive:false});
document.addEventListener('touchmove',function(e){e.preventDefault();if(!isDragging)return;onMove(e.changedTouches[0].clientX,e.changedTouches[0].clientY);},{passive:false});
document.addEventListener('touchend',onEnd,{passive:false});
document.addEventListener('touchcancel',onEnd,{passive:false});

// 陀螺儀
if(window.DeviceOrientationEvent){
  window.addEventListener('deviceorientation',function(e){
    if(!isDragging){
      px=Math.max(-1,Math.min(1,(e.gamma||0)/22));
      py=Math.max(-1,Math.min(1,((e.beta||0)-30)/26));
      applyTilt(px,py);
    }
  });
}

// 自動浮動
var autoT=0;
(function loop(){
  if(!isDragging){autoT+=.012;applyTilt(Math.sin(autoT)*.4,Math.cos(autoT*.65)*.25);}
  requestAnimationFrame(loop);
})();

setTimeout(function(){document.getElementById('hintTxt').style.opacity='0';},5000);
</script>
