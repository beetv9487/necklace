<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🔧 調整工具</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:#0d0d1a;color:#e8d5a3;font-family:monospace;
  display:flex;flex-direction:column;align-items:center;
  padding:12px;min-height:100vh;touch-action:pan-y;
}
.scene{perspective:700px;margin-bottom:10px;}
.card{
  position:relative;width:min(260px,78vw);aspect-ratio:3/4;
  border-radius:8px;touch-action:none;
  box-shadow:0 20px 50px rgba(0,0,0,.9);overflow:hidden;background:#111;
}
.l-bg{position:absolute;left:0;top:0;width:100%;height:100%;z-index:1;will-change:transform;}
.l-bg img{width:100%;height:100%;object-fit:cover;display:block;transform-origin:center center;}
.l-fg{position:absolute;left:50%;top:50%;z-index:2;will-change:transform;
  filter:drop-shadow(-4px 0 10px rgba(0,0,0,.6)) drop-shadow(4px 0 10px rgba(0,0,0,.6));}
.l-fg img{display:block;object-fit:contain;transform-origin:center center;}
.cross{position:absolute;inset:0;z-index:8;pointer-events:none;}
.cross::before,.cross::after{content:"";position:absolute;background:rgba(255,220,0,.3);}
.cross::before{left:50%;top:0;width:1px;height:100%;}
.cross::after{top:50%;left:0;height:1px;width:100%;}
#dot{position:absolute;z-index:9;width:10px;height:10px;border:2px solid #ff6;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;}
.vignette{position:absolute;inset:0;z-index:3;pointer-events:none;background:radial-gradient(ellipse 70% 72% at 50% 50%,transparent 20%,rgba(2,1,10,.75) 100%);}
.frame{position:absolute;inset:0;z-index:7;pointer-events:none;box-shadow:inset 0 0 0 2px rgba(201,169,110,.5);}

.status{width:100%;max-width:320px;background:#0a0a18;border:1px solid #333;border-radius:6px;padding:7px 10px;font-size:.68rem;line-height:1.9;margin-bottom:8px;}
.status span{color:#7af;}
.tabs{display:flex;gap:4px;width:100%;max-width:320px;margin-bottom:8px;}
.tab{flex:1;padding:8px 0;text-align:center;font-size:.6rem;border:1px solid #444;border-radius:5px;background:#111;cursor:pointer;}
.tab.on{background:#c9a96e20;border-color:#c9a96e;color:#c9a96e;}
.panel{width:100%;max-width:320px;display:none;flex-direction:column;gap:6px;}
.panel.on{display:flex;}
.section{background:#0a0a18;border:1px solid #2a2a3a;border-radius:6px;padding:10px;}
.section h3{font-size:.68rem;color:#c9a96e;margin-bottom:8px;}
.row{display:flex;align-items:center;gap:6px;margin-bottom:6px;}
.row label{font-size:.65rem;color:#aaa;width:44px;flex-shrink:0;}
.row input[type=range]{flex:1;accent-color:#c9a96e;height:20px;}
.row .val{font-size:.68rem;color:#ff6;width:42px;text-align:right;flex-shrink:0;}
.btn{width:100%;max-width:320px;padding:11px;border:1px solid #c9a96e;background:transparent;color:#e8d5a3;font-family:monospace;font-size:.75rem;cursor:pointer;border-radius:5px;margin-top:4px;}
.btn:active{background:#c9a96e30;}
.result{width:100%;max-width:320px;background:#010d01;border:1px solid #4a4;border-radius:6px;padding:10px;font-size:.72rem;line-height:2;color:#4f4;white-space:pre;margin-top:4px;display:none;}
.tip{font-size:.6rem;color:#555;text-align:center;margin-top:4px;}
</style>
</head>
<body>
<div class="scene">
  <div class="card" id="card">
    <div class="l-bg" id="lBg"><img id="bgImg" alt=""></div>
    <div class="l-fg" id="lFg"><img id="fgImg" alt=""></div>
    <div class="vignette"></div>
    <div class="cross"></div>
    <div id="dot"></div>
    <div class="frame"></div>
  </div>
</div>
<div class="tip">拖動卡片調整視角 · 雙擊回正面</div>

<div class="status">
  傾斜 X:<span id="sTx"> 0.00</span>  Y:<span id="sTy"> 0.00</span><br>
  前景位置 X:<span id="sFx"> 0</span>%  Y:<span id="sFy"> 0</span>% 旋轉:<span id="sFr"> 0</span>°<br>
  前景大小: <span id="sFz"> 100</span>%
</div>

<div class="tabs">
  <div class="tab on" id="tab0" onclick="switchTab(0)">📍 位置/大小</div>
  <div class="tab" id="tab1" onclick="switchTab(1)">🔄 旋轉</div>
  <div class="tab" id="tab2" onclick="switchTab(2)">🔵 前景視差</div>
  <div class="tab" id="tab3" onclick="switchTab(3)">🟠 背景視差</div>
</div>

<div class="panel on" id="p0">
  <div class="section">
    <h3>前景位置 & 大小</h3>
    <div class="row"><label>X軸</label><input type="range" id="fgX" min="-50" max="50" value="0" step="1"><span class="val" id="vFgX">0</span>%</div>
    <div class="row"><label>Y軸</label><input type="range" id="fgY" min="-50" max="50" value="0" step="1"><span class="val" id="vFgY">0</span>%</div>
    <div class="row"><label>大小</label><input type="range" id="fgZ" min="60" max="200" value="100" step="1"><span class="val" id="vFgZ">100</span>%</div>
  </div>
</div>

<div class="panel" id="p1">
  <div class="section">
    <h3>旋轉角度</h3>
    <div class="row"><label>前景旋轉</label><input type="range" id="fgR" min="-180" max="180" value="0" step="1"><span class="val" id="vFgR">0</span>°</div>
    <div class="row"><label>背景旋轉</label><input type="range" id="bgR" min="-180" max="180" value="0" step="1"><span class="val" id="vBgR">0</span>°</div>
  </div>
</div>

<div class="panel" id="p2">
  <div class="section">
    <h3>前景視差（人物凸出量）</h3>
    <div class="row"><label>X軸</label><input type="range" id="fpX" min="0" max="30" value="9" step="0.5"><span class="val" id="vFpX">9</span>%</div>
    <div class="row"><label>Y軸</label><input type="range" id="fpY" min="0" max="30" value="6" step="0.5"><span class="val" id="vFpY">6</span>%</div>
    <div class="row"><label>卡片X°</label><input type="range" id="tltX" min="0" max="40" value="18" step="1"><span class="val" id="vTltX">18</span>°</div>
    <div class="row"><label>卡片Y°</label><input type="range" id="tltY" min="0" max="40" value="13" step="1"><span class="val" id="vTltY">13</span>°</div>
  </div>
</div>

<div class="panel" id="p3">
  <div class="section">
    <h3>背景視差（背景退後量）</h3>
    <div class="row"><label>X軸</label><input type="range" id="bpX" min="0" max="20" value="7" step="0.5"><span class="val" id="vBpX">7</span>%</div>
    <div class="row"><label>Y軸</label><input type="range" id="bpY" min="0" max="20" value="5" step="0.5"><span class="val" id="vBpY">5</span>%</div>
  </div>
</div>

<button class="btn" onclick="saveParams()">💾 記錄目前參數</button>
<div class="result" id="result"></div>

document.getElementById('bgImg').src = 'data:image/jpeg;base64,' + B64_BG;
document.getElementById('fgImg').src = 'data:image/png;base64,' + B64_FG;

var card=document.getElementById('card');
var lBg=document.getElementById('lBg');
var lFg=document.getElementById('lFg');
var fgImg=document.getElementById('fgImg');
var bgImg=document.getElementById('bgImg');
var dot=document.getElementById('dot');

var P={fgX:0,fgY:0,fgZ:100,fgR:0,bgR:0,fpX:9,fpY:6,bpX:7,bpY:5,tltX:18,tltY:13};
var lastNx=0,lastNy=0,isDragging=false,startX=0,startY=0,startNx=0,startNy=0;
var lastTap=0;

function bind(id,key,vid){
  document.getElementById(id).addEventListener('input',function(){
    P[key]=parseFloat(this.value);
    document.getElementById(vid).textContent=this.value;
    applyTilt(lastNx,lastNy);
  });
}
bind('fgX','fgX','vFgX'); bind('fgY','fgY','vFgY'); bind('fgZ','fgZ','vFgZ');
bind('fgR','fgR','vFgR'); bind('bgR','bgR','vBgR');
bind('fpX','fpX','vFpX'); bind('fpY','fpY','vFpY');
bind('bpX','bpX','vBpX'); bind('bpY','bpY','vBpY');
bind('tltX','tltX','vTltX'); bind('tltY','tltY','vTltY');

function applyTilt(nx,ny){
  lastNx=nx; lastNy=ny;
  var cw=card.offsetWidth||260, ch=card.offsetHeight||347;
  card.style.transform='perspective(700px) rotateY('+(nx*P.tltX)+'deg) rotateX('+(-ny*P.tltY)+'deg)';

  // BG: 同向移動 + 旋轉
  lBg.style.transform='translate('+(nx*P.bpX)+'%,'+(ny*P.bpY)+'%)';
  bgImg.style.transform='rotate('+P.bgR+'deg)';

  // FG: 反向移動 + 旋轉
  var s=P.fgZ/100;
  fgImg.style.width=(cw*s)+'px'; fgImg.style.height=(ch*s)+'px';
  fgImg.style.transform='rotate('+P.fgR+'deg)';
  var ox=(P.fgX/100*cw)-(nx*P.fpX/100*cw);
  var oy=(P.fgY/100*ch)-(ny*P.fpY/100*ch);
  lFg.style.transform='translate(calc(-50% + '+ox+'px),calc(-50% + '+oy+'px))';

  dot.style.left=(50+P.fgX)+'%';
  dot.style.top=(50+P.fgY)+'%';

  document.getElementById('sTx').textContent=' '+nx.toFixed(2);
  document.getElementById('sTy').textContent=' '+ny.toFixed(2);
  document.getElementById('sFx').textContent=' '+P.fgX;
  document.getElementById('sFy').textContent=' '+P.fgY;
  document.getElementById('sFr').textContent=' '+P.fgR;
  document.getElementById('sFz').textContent=' '+P.fgZ;
}

card.addEventListener('touchstart',function(e){
  e.preventDefault();
  var now=Date.now();
  if(now-lastTap<300){ lastNx=0; lastNy=0; applyTilt(0,0); lastTap=0; return; }
  lastTap=now;
  isDragging=true;
  startX=e.touches[0].clientX; startY=e.touches[0].clientY;
  startNx=lastNx; startNy=lastNy;
},{passive:false});

document.addEventListener('touchmove',function(e){
  if(!isDragging)return;
  e.preventDefault();
  var nx=Math.max(-1,Math.min(1,startNx+(e.touches[0].clientX-startX)/80));
  var ny=Math.max(-1,Math.min(1,startNy+(e.touches[0].clientY-startY)/80));
  applyTilt(nx,ny);
},{passive:false});

document.addEventListener('touchend',function(){isDragging=false;},{passive:false});

function switchTab(i){
  for(var j=0;j<4;j++){
    document.getElementById('tab'+j).classList.toggle('on',j===i);
    document.getElementById('p'+j).classList.toggle('on',j===i);
  }
}

function saveParams(){
  var r=document.getElementById('result');
  r.style.display='block';
  r.textContent=
    '前景位置 X: '+P.fgX+'%\n'+
    '前景位置 Y: '+P.fgY+'%\n'+
    '前景大小:   '+P.fgZ+'%\n'+
    '前景旋轉:   '+P.fgR+'°\n'+
    '背景旋轉:   '+P.bgR+'°\n'+
    '前景視差 X: '+P.fpX+'%\n'+
    '前景視差 Y: '+P.fpY+'%\n'+
    '背景視差 X: '+P.bpX+'%\n'+
    '背景視差 Y: '+P.bpY+'%\n'+
    '卡片傾斜 X: '+P.tltX+'°\n'+
    '卡片傾斜 Y: '+P.tltY+'°';
}

applyTilt(0,0);
</script>
