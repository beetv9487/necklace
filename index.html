<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>💫 給你的驚喜</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  width:100%;height:100%;
  background:#04030a;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  overflow:hidden;user-select:none;
  -webkit-user-select:none;
  touch-action:none;
}

/* 讓卡片有更深的景深感 */
.scene{
  perspective:500px;
  perspective-origin:50% 50%;
}

.card-wrap{
  position:relative;
  width:min(300px,82vw);
  border-radius:8px;overflow:hidden;
  touch-action:none;
  -webkit-touch-callout:none;
  cursor:grab;
  /* 讓陰影跟著動 */
  transition:box-shadow .1s;
  box-shadow:0 20px 60px rgba(0,0,0,.85);
  transform-style:preserve-3d;
}
.card-wrap:active{cursor:grabbing;}
video{width:100%;display:block;pointer-events:none;border-radius:8px;}

/* 光澤層 - 傾斜時出現反光 */
.gloss{
  position:absolute;inset:0;
  border-radius:8px;
  pointer-events:none;
  background:linear-gradient(135deg,rgba(255,255,255,.15) 0%,transparent 50%,rgba(0,0,0,.1) 100%);
  transition:opacity .1s;
  mix-blend-mode:screen;
}

/* 邊緣高光 */
.rim{
  position:absolute;inset:0;
  border-radius:8px;
  pointer-events:none;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3), inset 0 -1px 0 rgba(0,0,0,.3);
}

.hint{
  position:absolute;bottom:12px;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,.65);color:rgba(255,255,255,.85);
  font-size:.65rem;letter-spacing:.1em;
  padding:.3rem .9rem;border-radius:20px;
  white-space:nowrap;pointer-events:none;
  transition:opacity .6s;font-family:serif;
}

.caption{
  color:#e8d5a3;font-family:serif;font-style:italic;
  font-size:1rem;text-align:center;margin-top:1rem;
  letter-spacing:.05em;line-height:1.6;
}
</style>
</head>
<body>
<div class="scene">
  <div class="card-wrap" id="card">
    <video id="vid" preload="auto" muted playsinline webkit-playsinline x5-playsinline>
      <source src="video.mp4" type="video/mp4">
    </video>
    <div class="gloss" id="gloss"></div>
    <div class="rim"></div>
    <div class="hint" id="hint">拖動畫面控制視角</div>
  </div>
</div>

<p class="caption">每次看見這條項鍊<br>就想起你</p>

<script>
var vid = document.getElementById('vid');
var card = document.getElementById('card');
var gloss = document.getElementById('gloss');
var hint = document.getElementById('hint');

var DURATION = 7.0;
var px = 0.5, py = 0.5;
var isDragging = false;
var startX = 0, startY = 0;
var startPx = 0.5, startPy = 0.5;
var lastSeekTime = 0;

vid.addEventListener('loadedmetadata', function() {
  vid.pause();
  vid.currentTime = DURATION * 0.5;
});
vid.addEventListener('play', function() { vid.pause(); });

function seekTo(nx, ny) {
  px = Math.max(0, Math.min(1, nx));
  py = Math.max(0, Math.min(1, ny));

  // Seek video
  var now = Date.now();
  if (now - lastSeekTime > 16) {
    vid.currentTime = px * DURATION;
    lastSeekTime = now;
  }

  // 傾斜角度大幅提升：水平最大 ±35度，垂直最大 ±25度
  var ry = (px - 0.5) * 2 * 35;
  var rx = (py - 0.5) * 2 * -25;

  card.style.transform =
    'rotateY(' + ry + 'deg) rotateX(' + rx + 'deg)';

  // 動態陰影：傾斜時陰影跟著位移
  var shadowX = (px - 0.5) * -30;
  var shadowY = (py - 0.5) * 20 + 20;
  var shadowBlur = 40 + Math.abs(px - 0.5) * 40;
  card.style.boxShadow =
    shadowX + 'px ' + shadowY + 'px ' + shadowBlur + 'px rgba(0,0,0,.9)';

  // 光澤層跟著傾斜方向移動
  var gx = 20 + (1 - px) * 60;
  var gy = 20 + (1 - py) * 60;
  gloss.style.background =
    'radial-gradient(ellipse 80% 80% at ' + gx + '% ' + gy + '%, rgba(255,255,255,.18) 0%, transparent 55%)';
}

function onStart(ex, ey) {
  isDragging = true;
  startX = ex; startY = ey;
  startPx = px; startPy = py;
  hint.style.opacity = '0';
  card.style.transition = '';
}

function onMove(ex, ey) {
  if (!isDragging) return;
  // 靈敏度提高：150px = 全範圍
  seekTo(startPx + (ex - startX) / 150, startPy + (ey - startY) / 150);
}

function onEnd() {
  isDragging = false;
  // 放手後平滑回中間（可選：若想停在當前位置就刪掉這段）
  // card.style.transition = 'transform .4s ease, box-shadow .4s ease';
  // seekTo(0.5, 0.5);
}

// Mouse
card.addEventListener('mousedown', function(e) {
  onStart(e.clientX, e.clientY); e.preventDefault();
});
document.addEventListener('mousemove', function(e) { onMove(e.clientX, e.clientY); });
document.addEventListener('mouseup', onEnd);

// Touch
card.addEventListener('touchstart', function(e) {
  e.preventDefault();
  onStart(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
}, {passive:false});
document.addEventListener('touchmove', function(e) {
  e.preventDefault();
  if (!isDragging) return;
  onMove(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
}, {passive:false});
document.addEventListener('touchend', onEnd, {passive:false});
document.addEventListener('touchcancel', onEnd, {passive:false});

setTimeout(function() { hint.style.opacity = '0'; }, 4000);
</script>
</body>
</html>
