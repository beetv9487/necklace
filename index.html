<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>💫 給你的驚喜</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:#0d0d1a;
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;overflow:hidden;touch-action:none;
}

/* 開場淡入 */
#wrap{opacity:0;transition:opacity 1.2s ease;}
#wrap.show{opacity:1;}

.scene{perspective:700px;}
.card{
  position:relative;width:min(320px,90vw);aspect-ratio:3/4;
  border-radius:8px;touch-action:none;
  box-shadow:0 20px 60px rgba(0,0,0,.85);overflow:hidden;background:#111;
  cursor:grab;
}
.card:active{cursor:grabbing;}
.l-bg{position:absolute;left:0;top:0;width:100%;height:100%;z-index:1;will-change:transform;}
.l-bg img{
  width:100%;height:100%;object-fit:cover;display:block;
  transform-origin:center center;
  /* 背景亮度拉高接近原始 */
  filter:brightness(1.0) contrast(1.05);
}
.l-fg{position:absolute;left:50%;top:50%;z-index:2;will-change:transform;
  filter:drop-shadow(-4px 0 14px rgba(0,0,0,.65)) drop-shadow(4px 0 14px rgba(0,0,0,.65)) drop-shadow(0 8px 20px rgba(0,0,0,.7));}
.l-fg img{display:block;object-fit:contain;transform-origin:center center;}
.vignette{position:absolute;inset:0;z-index:3;pointer-events:none;
  background:radial-gradient(ellipse 75% 75% at 50% 50%,transparent 30%,rgba(2,1,10,.55) 100%);}
.frame{position:absolute;inset:0;z-index:7;pointer-events:none;
  box-shadow:inset 0 0 0 2px rgba(201,169,110,.5);}
</style>
</head>
<body>
<div id="wrap">
  <div class="scene">
    <div class="card" id="card">
      <div class="l-bg" id="lBg"><img id="bgImg" alt=""></div>
      <div class="l-fg" id="lFg"><img id="fgImg" alt=""></div>
      <div class="vignette"></div>
      <div class="frame"></div>
    </div>
  </div>
</div>

document.getElementById('fgImg').src = 'person.png';

// 開場淡入
window.addEventListener('load', function(){
  setTimeout(function(){ document.getElementById('wrap').classList.add('show'); }, 100);
});

var card=document.getElementById('card');
var lBg=document.getElementById('lBg');
var lFg=document.getElementById('lFg');
var fgImg=document.getElementById('fgImg');

var P={
  fgX:0, fgY:0, fgZ:120,
  fgR:0, bgR:-11, bgZ:160,
  fpX:4.5, fpY:7.5,
  bpX:8.5, bpY:6,
  tltX:15, tltY:6
};

var lastNx=0, lastNy=0;
var isDragging=false, startX=0, startY=0, startNx=0, startNy=0;
var lastTap=0;

// 自動輕微浮動
var floatT=0, floatAnim=null;
function startFloat(){
  floatAnim = setInterval(function(){
    if(isDragging) return;
    floatT += 0.025;
    var nx = Math.sin(floatT * 0.7) * 0.08;
    var ny = Math.sin(floatT) * 0.06;
    applyTilt(nx, ny);
  }, 30);
}
startFloat();

function applyTilt(nx,ny){
  lastNx=nx; lastNy=ny;
  var cw=card.offsetWidth||320, ch=card.offsetHeight||427;
  card.style.transform='perspective(700px) rotateY('+(nx*P.tltX)+'deg) rotateX('+(-ny*P.tltY)+'deg)';
  lBg.style.transform='translate('+(nx*P.bpX)+'%,'+(ny*P.bpY)+'%)';
  document.getElementById('bgImg').style.transform='rotate('+P.bgR+'deg) scale('+(P.bgZ/100)+')';
  // 右滑變大、左滑變小，最大最小相差20%
  var s=(P.fgZ + nx*10)/100;
  fgImg.style.width=(cw*s)+'px'; fgImg.style.height=(ch*s)+'px';
  fgImg.style.transform='rotate('+P.fgR+'deg)';
  var ox=(P.fgX/100*cw)-(nx*P.fpX/100*cw);
  var oy=(P.fgY/100*ch)-(ny*P.fpY/100*ch);
  lFg.style.transform='translate(calc(-50% + '+ox+'px),calc(-50% + '+oy+'px))';
}

// 滑鼠
card.addEventListener('mousedown',function(e){
  isDragging=true; startX=e.clientX; startY=e.clientY;
  startNx=lastNx; startNy=lastNy; e.preventDefault();
});
document.addEventListener('mousemove',function(e){
  if(!isDragging)return;
  var nx=Math.max(-1,Math.min(1,startNx+(e.clientX-startX)/80));
  var ny=Math.max(-1,Math.min(1,startNy+(e.clientY-startY)/80));
  applyTilt(nx,ny);
});
document.addEventListener('mouseup',function(){
  isDragging=false;
  // 放開後回到浮動中心
  setTimeout(function(){ lastNx=0; lastNy=0; floatT=0; }, 300);
});
card.addEventListener('dblclick',function(){ lastNx=0; lastNy=0; floatT=0; applyTilt(0,0); });

// 觸控
card.addEventListener('touchstart',function(e){
  e.preventDefault();
  var now=Date.now();
  if(now-lastTap<300){ lastNx=0; lastNy=0; floatT=0; applyTilt(0,0); lastTap=0; return; }
  lastTap=now; isDragging=true;
  startX=e.touches[0].clientX; startY=e.touches[0].clientY;
  startNx=lastNx; startNy=lastNy;
},{passive:false});
document.addEventListener('touchmove',function(e){
  if(!isDragging)return; e.preventDefault();
  var nx=Math.max(-1,Math.min(1,startNx+(e.touches[0].clientX-startX)/80));
  var ny=Math.max(-1,Math.min(1,startNy+(e.touches[0].clientY-startY)/80));
  applyTilt(nx,ny);
},{passive:false});
document.addEventListener('touchend',function(){
  isDragging=false;
  setTimeout(function(){ lastNx=0; lastNy=0; floatT=0; }, 300);
},{passive:false});

applyTilt(0,0);
</script>
