<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>💫 給你的驚喜</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  width:100%;height:100%;
  background:#04030a;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  overflow:hidden;user-select:none;
  -webkit-user-select:none;
  touch-action:none;
  font-family:serif;color:#e8d5a3;
}
.scene{perspective:500px;perspective-origin:50% 50%;}
.card{
  position:relative;
  width:min(300px,82vw);
  aspect-ratio:3/4;
  border-radius:8px;
  touch-action:none;cursor:grab;
  transform-style:preserve-3d;
  box-shadow:0 30px 70px rgba(0,0,0,.9);
}
.card:active{cursor:grabbing;}
.layer{position:absolute;inset:0;border-radius:8px;overflow:hidden;will-change:transform;}

/* 夜景背景 — 最遠 */
.l-sky{z-index:1;}
.l-sky svg{width:100%;height:100%;display:block;}

/* 煙火 */
#fw{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none;}

/* 邊緣模糊 — 遠景 */
.l-edge{z-index:3;}
.l-edge img{width:100%;height:100%;object-fit:cover;display:block;filter:blur(6px) brightness(0.6) saturate(0.7);}

/* 完整照片 — 中景 */
.l-photo{z-index:4;}
.l-photo img{width:100%;height:100%;object-fit:cover;display:block;}

/* 中央凸出 — 最近，只顯示中央橢圓 */
.l-center{z-index:5;}
.l-center img{
  width:108%;height:108%;
  object-fit:cover;display:block;
  margin:-4%;
  filter:brightness(1.08) contrast(1.05);
  -webkit-mask-image:radial-gradient(ellipse 62% 68% at 50% 48%, black 30%, transparent 72%);
  mask-image:radial-gradient(ellipse 62% 68% at 50% 48%, black 30%, transparent 72%);
}

.vignette{
  position:absolute;inset:0;z-index:6;pointer-events:none;border-radius:8px;
  background:radial-gradient(ellipse 70% 72% at 50% 50%,transparent 20%,rgba(2,1,10,.88) 100%);
}
.gloss{position:absolute;inset:0;z-index:7;pointer-events:none;border-radius:8px;mix-blend-mode:screen;transition:background .05s;}
.frame{
  position:absolute;inset:0;z-index:8;pointer-events:none;border-radius:8px;
  box-shadow:inset 0 0 0 2px rgba(201,169,110,.5),inset 0 0 0 7px rgba(0,0,0,.15);
}
.frame::after{
  content:"✦  給你的  ✦";
  position:absolute;top:10px;left:50%;transform:translateX(-50%);
  font-size:.55rem;color:rgba(201,169,110,.65);letter-spacing:.15em;white-space:nowrap;font-style:italic;
}
.corners{position:absolute;inset:0;z-index:9;pointer-events:none;}
.c{position:absolute;width:15px;height:15px;border-color:#c9a96e;border-style:solid;opacity:.8;}
.tl{top:4px;left:4px;border-width:2px 0 0 2px;}.tr{top:4px;right:4px;border-width:2px 2px 0 0;}
.bl{bottom:4px;left:4px;border-width:0 0 2px 2px;}.br{bottom:4px;right:4px;border-width:0 2px 2px 0;}

.shadow-el{
  width:min(280px,75vw);height:18px;
  background:radial-gradient(ellipse,rgba(0,0,20,.9) 0%,transparent 70%);
  margin-top:3px;filter:blur(6px);transition:transform .05s;
}
.caption{font-style:italic;font-size:1rem;text-align:center;margin-top:.9rem;letter-spacing:.05em;line-height:1.6;}
.hint-txt{font-size:.6rem;letter-spacing:.15em;color:rgba(201,169,110,.38);margin-top:.4rem;text-align:center;transition:opacity .5s;}
</style>
</head>
<body>
<div class="scene">
  <div class="card" id="card">
    <div class="layer l-sky" id="lSky">
      <svg viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
        <defs>
          <radialGradient id="sg" cx="50%" cy="25%" r="75%">
            <stop offset="0%" stop-color="#07043a"/>
            <stop offset="45%" stop-color="#04021c"/>
            <stop offset="100%" stop-color="#010008"/>
          </radialGradient>
          <radialGradient id="mg" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#fffceb"/>
            <stop offset="100%" stop-color="#fff0b0" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <rect width="300" height="400" fill="url(#sg)"/>
        <ellipse cx="248" cy="40" rx="52" ry="42" fill="url(#mg)" opacity=".28"/>
        <circle cx="248" cy="40" r="9" fill="#fffceb" opacity=".95"/>
        <circle cx="18" cy="22" r="1.1" fill="white" opacity=".9"/>
        <circle cx="42" cy="10" r="1.3" fill="white" opacity=".7"/>
        <circle cx="68" cy="28" r=".9" fill="white" opacity=".8"/>
        <circle cx="118" cy="20" r="1.3" fill="white" opacity=".9"/>
        <circle cx="158" cy="48" r="1.1" fill="white" opacity=".7"/>
        <circle cx="265" cy="18" r="1.3" fill="white" opacity=".75"/>
        <circle cx="82" cy="16" r="1.6" fill="#fffce0">
          <animate attributeName="opacity" values=".3;1;.3" dur="2.2s" repeatCount="indefinite"/>
        </circle>
        <circle cx="192" cy="43" r="1.5" fill="#e0e8ff">
          <animate attributeName="opacity" values=".25;.9;.25" dur="3.5s" repeatCount="indefinite"/>
        </circle>
        <circle cx="262" cy="33" r="1.5" fill="#ffe8c0">
          <animate attributeName="opacity" values=".3;1;.3" dur="1.9s" repeatCount="indefinite"/>
        </circle>
        <rect x="0" y="255" width="300" height="85" fill="rgba(255,90,28,.08)"/>
        <polygon fill="#020110" points="0,400 0,315 8,315 8,295 14,280 20,272 27,262 34,252 34,270 42,258 50,250 56,242 62,270 68,232 72,250 80,228 86,254 92,222 98,250 104,218 110,246 116,225 120,220 130,226 132,215 138,230 142,222 148,218 154,244 160,222 166,215 174,220 180,248 186,226 192,220 200,230 202,218 208,248 214,228 222,238 228,265 234,248 242,258 250,265 258,275 266,295 274,318 284,318 294,320 300,400"/>
        <rect x="50" y="255" width="2" height="3" fill="#ffc050" opacity=".9"/>
        <rect x="92" y="226" width="2" height="3" fill="#ffd080" opacity=".9"/>
        <rect x="120" y="222" width="2" height="3" fill="#ffc850" opacity=".85"/>
        <rect x="164" y="217" width="2" height="3" fill="#ffd080" opacity=".85"/>
        <rect x="192" y="220" width="2" height="3" fill="#ffc850" opacity=".9"/>
        <rect x="215" y="230" width="2" height="3" fill="#ffc050" opacity=".8"/>
      </svg>
    </div>

    <canvas id="fw"></canvas>

    <!-- 用 img 標籤直接載入同目錄的 photo.jpg，完全沒有跨域問題 -->
    <div class="layer l-edge" id="lEdge">
      <img src="photo.jpg" alt="">
    </div>
    <div class="layer l-photo" id="lPhoto">
      <img src="photo.jpg" alt="">
    </div>
    <div class="layer l-center" id="lCenter">
      <img src="photo.jpg" alt="">
    </div>

    <div class="vignette"></div>
    <div class="gloss" id="gloss"></div>
    <div class="frame"></div>
    <div class="corners">
      <div class="c tl"></div><div class="c tr"></div>
      <div class="c bl"></div><div class="c br"></div>
    </div>
  </div>
</div>
<div class="shadow-el" id="shadowEl"></div>
<p class="caption">每次看見這條項鍊<br>就想起你</p>
<div class="hint-txt" id="hintTxt">移動滑鼠或傾斜手機 · 感受景深</div>

<script>
var card=document.getElementById('card');
var lSky=document.getElementById('lSky');
var lEdge=document.getElementById('lEdge');
var lPhoto=document.getElementById('lPhoto');
var lCenter=document.getElementById('lCenter');
var gloss=document.getElementById('gloss');
var shadowEl=document.getElementById('shadowEl');
var fwCvs=document.getElementById('fw');
var fwCtx=fwCvs.getContext('2d');
var px=0,py=0,isDragging=false,startX=0,startY=0,startPx=0,startPy=0;
var W=300,H=400;

// Fireworks
var fwList=[],fwParts=[];
function makeFW(d){
  var f={d:d,x:0,y:0,hue:0,exploded:false};
  f.reset=function(){this.x=W*(.1+Math.random()*.8);this.y=H*(.04+Math.random()*.45);this.exploded=false;this.hue=Math.random()<.5?12+Math.random()*22:268+Math.random()*70;};
  f.tick=function(){if(this.d>0){this.d--;return;}if(!this.exploded){this.exploded=true;burst(this);}};
  f.reset(); return f;
}
function burst(fw){
  for(var i=0;i<48+Math.floor(Math.random()*22);i++){
    var a=Math.random()*Math.PI*2,s=.8+Math.random()*4;
    fwParts.push({x:fw.x,y:fw.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,decay:.015+Math.random()*.02,size:.8+Math.random()*2,hue:fw.hue+(Math.random()*38-19),trail:[]});
  }
  var ref=fw;
  setTimeout(function(){ref.reset();ref.d=0;ref.exploded=false;},2000+Math.random()*3000);
}
for(var i=0;i<4;i++) fwList.push(makeFW(i*80+Math.random()*100));

function tickFW(){
  fwCvs.width=W;fwCvs.height=H;fwCtx.clearRect(0,0,W,H);
  fwList.forEach(function(f){f.tick();});
  for(var i=fwParts.length-1;i>=0;i--){
    var p=fwParts[i];
    p.trail.push({x:p.x,y:p.y});if(p.trail.length>5)p.trail.shift();
    p.x+=p.vx;p.y+=p.vy;p.vy+=.04;p.vx*=.97;p.vy*=.97;p.life-=p.decay;
    if(p.life<=0){fwParts.splice(i,1);continue;}
    for(var t=0;t<p.trail.length-1;t++){
      fwCtx.beginPath();fwCtx.moveTo(p.trail[t].x,p.trail[t].y);fwCtx.lineTo(p.trail[t+1].x,p.trail[t+1].y);
      fwCtx.strokeStyle='hsla('+p.hue+',90%,72%,'+(t/p.trail.length*p.life*.5)+')';fwCtx.lineWidth=p.size*.35;fwCtx.stroke();
    }
    fwCtx.beginPath();fwCtx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2);
    fwCtx.fillStyle='hsla('+p.hue+',90%,80%,'+p.life*.9+')';fwCtx.fill();
    var g=fwCtx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.size*4);
    g.addColorStop(0,'hsla('+p.hue+',90%,80%,'+p.life*.2+')');g.addColorStop(1,'transparent');
    fwCtx.fillStyle=g;fwCtx.beginPath();fwCtx.arc(p.x,p.y,p.size*4,0,Math.PI*2);fwCtx.fill();
  }
}

function applyTilt(nx,ny){
  card.style.transform='rotateY('+(nx*26)+'deg) rotateX('+(-ny*18)+'deg)';
  lSky.style.transform='translate('+(nx*6)+'%,'+(ny*4.5)+'%)';
  lEdge.style.transform='translate('+(nx*3)+'%,'+(ny*2.5)+'%)';
  lPhoto.style.transform='translate('+(-nx*2)+'%,'+(-ny*1.5)+'%)';
  lCenter.style.transform='translate('+(-nx*9)+'%,'+(-ny*6)+'%)';
  shadowEl.style.transform='skewX('+(nx*10)+'deg) scaleX('+(1-Math.abs(nx)*.32)+')';
  var gx=20+(1-(nx+1)/2)*60,gy=20+(1-(ny+1)/2)*60;
  gloss.style.background='radial-gradient(ellipse 70% 70% at '+gx+'% '+gy+'%, rgba(255,255,255,.13) 0%, transparent 55%)';
}

function onStart(ex,ey){isDragging=true;startX=ex;startY=ey;startPx=px;startPy=py;}
function onMove(ex,ey){
  if(!isDragging)return;
  px=Math.max(-1,Math.min(1,startPx+(ex-startX)/120));
  py=Math.max(-1,Math.min(1,startPy+(ey-startY)/120));
  applyTilt(px,py);
}
function onEnd(){isDragging=false;}

card.addEventListener('mousedown',function(e){onStart(e.clientX,e.clientY);e.preventDefault();});
document.addEventListener('mousemove',function(e){onMove(e.clientX,e.clientY);});
document.addEventListener('mouseup',onEnd);
card.addEventListener('touchstart',function(e){e.preventDefault();onStart(e.changedTouches[0].clientX,e.changedTouches[0].clientY);},{passive:false});
document.addEventListener('touchmove',function(e){e.preventDefault();if(!isDragging)return;onMove(e.changedTouches[0].clientX,e.changedTouches[0].clientY);},{passive:false});
document.addEventListener('touchend',onEnd,{passive:false});
document.addEventListener('touchcancel',onEnd,{passive:false});

if(window.DeviceOrientationEvent){
  window.addEventListener('deviceorientation',function(e){
    if(!isDragging){
      px=Math.max(-1,Math.min(1,(e.gamma||0)/20));
      py=Math.max(-1,Math.min(1,((e.beta||0)-30)/25));
      applyTilt(px,py);
    }
  });
}

var autoT=0;
function loop(){
  if(!isDragging){autoT+=.012;applyTilt(Math.sin(autoT)*.35,Math.cos(autoT*.65)*.22);}
  tickFW();requestAnimationFrame(loop);
}

W=card.offsetWidth||300;H=card.offsetHeight||400;
loop();
setTimeout(function(){document.getElementById('hintTxt').style.opacity='0';},5000);
</script>
</body>
</html>
